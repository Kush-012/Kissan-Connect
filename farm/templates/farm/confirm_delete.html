{% extends 'farm/base.html' %}
{% block title %}Delete {{ object_type }} – Kisan Connect{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Delete {{ object_type }}</h1>
</div>

<div class="card" style="max-width:480px;text-align:center;">
  <div style="font-size:3rem;margin-bottom:16px;">⚠️</div>
  <h2 style="color:#c62828;margin-bottom:12px;">Confirm Deletion</h2>
  <p style="color:#424242;margin-bottom:8px;">
    Are you sure you want to delete <strong>"{{ object }}"</strong>?
  </p>
  <p style="color:#757575;font-size:.9rem;margin-bottom:28px;">This action cannot be undone.</p>

  <form method="post" style="display:flex;gap:12px;justify-content:center;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
