<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Kisan Connect</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 40%, #388e3c 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 44px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }

  .auth-brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .auth-brand .icon { font-size: 2.8rem; display: block; margin-bottom: 6px; }
  .auth-brand h1 { font-size: 1.7rem; font-weight: 800; color: #1b5e20; }
  .auth-brand p { color: #757575; font-size: .9rem; margin-top: 4px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: #9e9e9e;
    font-size: .85rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e0e0e0;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-weight: 600;
    font-size: .875rem;
    color: #424242;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: .95rem;
    transition: border-color .2s, box-shadow .2s;
    background: #fafafa;
  }
  .form-group input:focus {
    outline: none;
    border-color: #2e7d32;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(46,125,50,.12);
  }

  .btn-login {
    width: 100%;
    padding: 12px;
    background: #2e7d32;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s, transform .1s;
    margin-top: 4px;
  }
  .btn-login:hover { background: #1b5e20; }
  .btn-login:active { transform: scale(.98); }

  .btn-google {
    width: 100%;
    padding: 11px;
    background: #fff;
    color: #424242;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background .2s, box-shadow .2s;
    text-decoration: none;
  }
  .btn-google:hover {
    background: #f5f5f5;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    text-decoration: none;
    color: #424242;
  }
  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

  .auth-footer {
    text-align: center;
    margin-top: 24px;
    color: #757575;
    font-size: .9rem;
  }
  .auth-footer a { color: #2e7d32; font-weight: 600; }

  .messages { list-style: none; margin-bottom: 16px; }
  .messages .error {
    background: #ffebee;
    color: #c62828;
    border-left: 4px solid #c62828;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: .9rem;
  }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-brand">
    <h1>Kisan Connect</h1>
    <p>Sign in to your account</p>
  </div>

  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
    {% csrf_token %}

    <div class="form-group">
      <label for="username">Username or Email</label>
      <input type="text" id="username" name="username" placeholder="Enter your username or email" required autofocus>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn-login">Login</button>
  </form>

  <div class="divider">OR</div>

  <a href="{% url 'google_login' %}?next=/" class="btn-google">
    <!-- Google "G" logo SVG -->
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continue with Google
  </a>

  <div class="auth-footer">
    Don't have an account?
    <a href="{% url 'register' %}">Create Account</a>
  </div>
</div>

</body>
</html>
