{% load static %}
<!-- Kisan Connect Floating Circular AI Chatbot Widget (Powered by Groq) -->
<div id="fmChatbotContainer" class="fm-chatbot-wrapper">
  <!-- Floating Circle Trigger Button -->
  <button id="fmChatTrigger" class="fm-chat-circle-btn" type="button" aria-label="Open Kisan AI Assistant" title="Ask Kisan AI">
    <div class="fm-chat-badge-pulse" id="fmChatBadgePulse"></div>
    <span class="fm-chat-icon fm-icon-open">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        <path d="M8 10h.01"></path>
        <path d="M12 10h.01"></path>
        <path d="M16 10h.01"></path>
      </svg>
    </span>
    <span class="fm-chat-icon fm-icon-close" style="display: none;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </span>
    <span class="fm-chat-tooltip">Ask Kisan AI</span>
  </button>

  <!-- Floating Chat Window Dialog -->
  <div id="fmChatWindow" class="fm-chat-dialog" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="fmChatTitle">
    <!-- Header -->
    <div class="fm-chat-header">
      <div class="fm-chat-header-info">
        <div class="fm-chat-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v1H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3V5a3 3 0 0 0-3-3z"></path>
            <circle cx="9" cy="13" r="1"></circle>
            <circle cx="15" cy="13" r="1"></circle>
          </svg>
          <span class="fm-online-dot" title="Online"></span>
        </div>
        <div class="fm-chat-title-group">
          <div class="fm-chat-title-row">
            <h3 id="fmChatTitle">Kisan AI</h3>
            <span class="fm-badge-status">Online</span>
          </div>
        </div>
      </div>
      <div class="fm-chat-header-actions">
        <button id="fmChatClearBtn" type="button" class="fm-header-icon-btn" title="Clear chat history" aria-label="Clear chat">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <polyline points="23 20 23 14 17 14"></polyline>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
          </svg>
        </button>
        <button id="fmChatCloseBtn" type="button" class="fm-header-icon-btn" title="Close chat" aria-label="Close chat">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Message History Body -->
    <div id="fmChatMessages" class="fm-chat-messages">
      <!-- Welcome Card -->
      <div class="fm-message fm-message-bot">
        <div class="fm-message-avatar">🌱</div>
        <div class="fm-message-content">
          <div class="fm-message-bubble">
            <p><strong>Namaste! Welcome to Kisan Connect.</strong></p>
            <p style="margin-top: 4px;">How can I help you today?</p>
          </div>
          <span class="fm-message-time">Just now</span>
        </div>
      </div>

      <!-- Quick Suggestion Chips -->
      <div id="fmSuggestions" class="fm-suggestions-container">
        <div class="fm-suggestions-label">Popular Questions:</div>
        <div class="fm-chips-grid">
          <button type="button" class="fm-chip-btn" data-query="What crops are currently available on this website?">🌾 Available Crops</button>
          <button type="button" class="fm-chip-btn" data-query="How does Market crop price discovery work?">📈 Market Crop Prices</button>
          <button type="button" class="fm-chip-btn" data-query="How can a buyer register and submit a purchase enquiry?">🛒 How to Buy</button>
          <button type="button" class="fm-chip-btn" data-query="Who are the registered farmers and what are their locations?">👨‍🌾 Registered Farmers</button>
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div id="fmTypingIndicator" class="fm-typing-row" style="display: none;">
      <div class="fm-message-avatar">🌱</div>
      <div class="fm-typing-bubble">
        <span class="fm-dot"></span>
        <span class="fm-dot"></span>
        <span class="fm-dot"></span>
      </div>
    </div>

    <!-- Footer Input Bar -->
    <form id="fmChatForm" class="fm-chat-footer" autocomplete="off">
      {% csrf_token %}
      <div class="fm-input-wrapper">
        <textarea
          id="fmChatInput"
          class="fm-chat-input"
          placeholder="Ask about crops, market prices, enquiries..."
          rows="1"
          maxlength="1000"
          required
        ></textarea>
        <button id="fmSendBtn" type="submit" class="fm-send-btn" aria-label="Send message" title="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>

<style>
  /* ══════════════════════════════════════════════════════════════
     FARMER MARKET CIRCULAR CHATBOT STYLES
     ══════════════════════════════════════════════════════════════ */
  .fm-chatbot-wrapper {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 99999;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  .fm-chat-circle-btn:hover {
    transform: translateY(-3px) scale(1.06);

<script>
(function() {
  const triggerBtn = document.getElementById('fmChatTrigger');
  const chatWindow = document.getElementById('fmChatWindow');
  const closeBtn = document.getElementById('fmChatCloseBtn');
  const clearBtn = document.getElementById('fmChatClearBtn');
  const chatForm = document.getElementById('fmChatForm');
  const chatInput = document.getElementById('fmChatInput');
  const sendBtn = document.getElementById('fmSendBtn');
  const messagesBox = document.getElementById('fmChatMessages');
  const typingIndicator = document.getElementById('fmTypingIndicator');
  const pulseBadge = document.getElementById('fmChatBadgePulse');
  const iconOpen = triggerBtn.querySelector('.fm-icon-open');
  const iconClose = triggerBtn.querySelector('.fm-icon-close');

  let chatHistory = [];
  let isSending = false;

  // Format simple markdown into sanitized HTML
  function formatMarkdown(text) {
    if (!text) return '';
    let escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    // Bold **text**
    escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Italic *text*
    escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');

    // Bullet points
    const lines = escaped.split('\n');
    let inList = false;
    let htmlLines = [];

    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith('- ') || trimmed.startsWith('• ') || trimmed.startsWith('* ')) {
        if (!inList) {
          htmlLines.push('<ul>');
          inList = true;
        }
        htmlLines.push('<li>' + trimmed.replace(/^[-•*]\s*/, '') + '</li>');
      } else {
        if (inList) {
          htmlLines.push('</ul>');
          inList = false;
        }
        if (trimmed.length > 0) {
          htmlLines.push('<p>' + trimmed + '</p>');
        }
      }
    });

    if (inList) {
      htmlLines.push('</ul>');
    }

    return htmlLines.join('');
  }

  function getTimeString() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function scrollToBottom() {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  function toggleChat(forceOpen = null) {
    const isVisible = chatWindow.style.display !== 'none';
    const shouldOpen = forceOpen !== null ? forceOpen : !isVisible;

    if (shouldOpen) {
      chatWindow.style.display = 'flex';
      iconOpen.style.display = 'none';
      iconClose.style.display = 'flex';
      triggerBtn.setAttribute('aria-expanded', 'true');
      if (pulseBadge) pulseBadge.style.display = 'none';
      setTimeout(() => {
        chatInput.focus();
        scrollToBottom();
      }, 100);
    } else {
      chatWindow.style.display = 'none';
      iconOpen.style.display = 'flex';
      iconClose.style.display = 'none';
      triggerBtn.setAttribute('aria-expanded', 'false');
    }
  }

  function appendMessage(sender, text) {
    const row = document.createElement('div');
    row.className = 'fm-message ' + (sender === 'user' ? 'fm-message-user' : 'fm-message-bot');

    const avatar = document.createElement('div');
    avatar.className = 'fm-message-avatar';
    avatar.textContent = sender === 'user' ? '👤' : '🌱';

    const content = document.createElement('div');
    content.className = 'fm-message-content';

    const bubble = document.createElement('div');
    bubble.className = 'fm-message-bubble';
    if (sender === 'user') {
      const p = document.createElement('p');
      p.textContent = text;
      bubble.appendChild(p);
    } else {
      bubble.innerHTML = formatMarkdown(text);
    }

    const timeSpan = document.createElement('span');
    timeSpan.className = 'fm-message-time';
    timeSpan.textContent = getTimeString();

    content.appendChild(bubble);
    content.appendChild(timeSpan);

    row.appendChild(avatar);
    row.appendChild(content);

    messagesBox.appendChild(row);
    scrollToBottom();
  }

  function getCsrfToken() {
    const csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
    if (csrfInput) return csrfInput.value;
    const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
    return cookie ? cookie.split('=')[1] : '';
  }

  async function handleSendMessage(messageText) {
    const text = (messageText || chatInput.value).trim();
    if (!text || isSending) return;

    // Reset input
    chatInput.value = '';
    chatInput.style.height = 'auto';

    // Show user message
    appendMessage('user', text);
    chatHistory.push({ role: 'user', content: text });

    // Show typing
    isSending = true;
    sendBtn.disabled = true;
    typingIndicator.style.display = 'flex';
    scrollToBottom();

    try {
      const response = await fetch('/api/chatbot/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCsrfToken(),
        },
        body: JSON.stringify({
          message: text,
          history: chatHistory.slice(-6)
        })
      });

      const data = await response.json();
      typingIndicator.style.display = 'none';

      if (data && data.reply) {
        appendMessage('bot', data.reply);
        chatHistory.push({ role: 'assistant', content: data.reply });
      } else {
        appendMessage('bot', "I am currently unable to fetch an answer. Please verify your connection or try asking again.");
      }
    } catch (err) {
      typingIndicator.style.display = 'none';
      appendMessage('bot', "Sorry, I encountered a network error connecting to our assistant. Please try again in a few moments.");
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      scrollToBottom();
      chatInput.focus();
    }
  }

  // Event Listeners
  triggerBtn.addEventListener('click', () => toggleChat());
  closeBtn.addEventListener('click', () => toggleChat(false));

  clearBtn.addEventListener('click', () => {
    if (confirm('Clear chat conversation?')) {
      chatHistory = [];
      const messages = messagesBox.querySelectorAll('.fm-message');
      messages.forEach((msg, idx) => {
        if (idx > 0) msg.remove(); // keep welcome message
      });
      const suggestions = document.getElementById('fmSuggestions');
      if (suggestions) suggestions.style.display = 'flex';
    }
  });

  // Suggestion chip clicks
  document.querySelectorAll('.fm-chip-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const query = this.getAttribute('data-query');
      if (query) {
        handleSendMessage(query);
      }
    });
  });

  // Form submit
  chatForm.addEventListener('submit', function(e) {
    e.preventDefault();
    handleSendMessage();
  });

  // Enter to send, Shift+Enter for new line
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSendMessage();
    }
  });

  // Auto-grow textarea
  chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 80) + 'px';
  });

  // Close on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && chatWindow.style.display !== 'none') {
      toggleChat(false);
    }
  });
})();
</script>
